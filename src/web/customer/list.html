<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>顧客一覧</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body class="container mt-5">
  <h2 class="mb-4">顧客一覧</h2>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>顧客ID</th>
        <th>会社名</th>
        <th>業種</th>
        <th>連絡先</th>
        <th>所在地</th>
        <th>登録日</th>
        <th>更新日</th>
      </tr>
    </thead>
    <tbody id="customer-table-body">
      <!-- 顧客データがここに入る -->
    </tbody>
  </table>

  <a href="/customer/add.html" class="btn btn-secondary">← ホームへ戻る</a>

  <script type="module">
    import config from './config.js';

    fetch(config.apiUrl + '/customers')
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById('customer-table-body');
        data.forEach(customer => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${customer.customer_id}</td>
            <td><a href="/customer/detail.html?id=${customer.customer_id}">${customer.company_name}</a></td>
            <td>${customer.industry}</td>
            <td>${customer.contact}</td>
            <td>${customer.location}</td>
            <td>${new Date(customer.created_date).toLocaleString()}</td>
            <td>${new Date(customer.updated_date).toLocaleString()}</td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(error => {
        console.error('Error loading customer data:', error);
        alert('顧客データの取得に失敗しました');
      });
  </script>
</body>
</html>
